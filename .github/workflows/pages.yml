# site/ 폴더를 GitHub Pages 로 배포한다.
# Pages 는 저장소 루트나 /docs 만 지원하는데 이 저장소는 docs/ 를 분석 문서에 쓰고 있어
# Actions 로 site/ 만 따로 올린다.
#
# 최초 1회: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔야 한다.

name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
