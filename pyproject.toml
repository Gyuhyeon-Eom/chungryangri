[project]
name = "chungryangri"
version = "0.1.0"
description = "청량리 전통시장 클러스터 상권 분석 — 활성화 정책 리포트"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "requests>=2.32",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "folium>=0.17",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "jupyterlab>=4.2",
    "scipy>=1.18.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]

[tool.uv]
package = false
